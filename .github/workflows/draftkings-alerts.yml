name: DraftKings Odds Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "5/10 * * * *"

permissions:
  contents: read

concurrency:
  group: draftkings-odds-alerts
  cancel-in-progress: true

jobs:
  scan:
    name: Compare DraftKings against Polymarket
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COMPARED_BOOK: DraftKings
      ALERT_STATE_FILE: alert_state_draftkings.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: alert_state_draftkings.json
          key: draftkings-alert-state-${{ github.run_id }}
          restore-keys: |
            draftkings-alert-state-

      - name: Run odds comparison scan
        run: python bot.py --once

      - name: Save alert state
        uses: actions/cache/save@v4
        with:
          path: alert_state_draftkings.json
          key: draftkings-alert-state-${{ github.run_id }}
